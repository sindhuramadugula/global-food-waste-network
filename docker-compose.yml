version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: food_waste_db
    environment:
      POSTGRES_USER: foodwaste
      POSTGRES_PASSWORD: foodwaste_dev_password
      POSTGRES_DB: food_waste_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - food_waste_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodwaste"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: food_waste_backend
    environment:
      DATABASE_URL: "postgresql://foodwaste:foodwaste_dev_password@postgres:5432/food_waste_network"
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
      - ./server/node_modules:/app/node_modules
    networks:
      - food_waste_network
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: food_waste_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
      VITE_SOCKET_URL: "http://localhost:5000"
    volumes:
      - ./client/src:/app/src
      - ./client/node_modules:/app/node_modules
    networks:
      - food_waste_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  food_waste_network:
    driver: bridge
